<text x="183" y="425" font-size="10.5" fill="#a9c6e2">30 MB จบโดยไม่พัง</text>
<rect x="308" y="120" width="448" height="336" rx="10" fill="#ffffff" fill-opacity="0.96"/>
<text x="324" y="148" font-size="16" fill="#0d2f57"><tspan font-weight="700" fill="#0d2f57">✓ รอบแรก — อ่านโค้ด (sink-driven)</tspan></text>
<text x="324" y="178" font-size="12.5" fill="#159947" font-weight="700">✓</text>
<text x="340" y="178.0" font-size="12.5" fill="#10283f"><tspan font-weight="700" fill="#0d2f57">Bind 127.0.0.1</tspan> เป็นค่าตั้งต้น</text>
<text x="340" y="195.5" font-size="12.5" fill="#10283f">มีเทสต์ล็อกพฤติกรรม</text>
<text x="324" y="221.0" font-size="12.5" fill="#159947" font-weight="700">✓</text>
<text x="340" y="221.0" font-size="12.5" fill="#10283f"><tspan font-weight="700" fill="#0d2f57">Mutation ต้องมี token + Origin</tspan></text>
<text x="340" y="238.5" font-size="12.5" fill="#10283f">token สุ่มต่อโปรเซส (24 bytes),</text>
<text x="340" y="256.0" font-size="12.5" fill="#10283f">Origin ต้องเป็น loopback</text>
<text x="324" y="281.5" font-size="12.5" fill="#159947" font-weight="700">✓</text>
<text x="340" y="281.5" font-size="12.5" fill="#10283f"><tspan font-weight="700" fill="#0d2f57">Proxy จำกัดแน่น</tspan> — GET/HEAD เท่านั้น,</text>
<text x="340" y="299.0" font-size="12.5" fill="#10283f">allowlist ของ path, กัน IP ภายใน</text>
<text x="340" y="316.5" font-size="12.5" fill="#10283f">169.254.169.254, ไม่ส่งต่อ credentials</text>
<text x="324" y="342.0" font-size="12.5" fill="#159947" font-weight="700">✓</text>
<text x="340" y="342.0" font-size="12.5" fill="#10283f"><tspan font-weight="700" fill="#0d2f57">ไม่มี shell injection</tspan> — เรียก process</text>
<text x="340" y="359.5" font-size="12.5" fill="#10283f">นอกด้วย argument array ทุกจุด</text>
<text x="324" y="385.0" font-size="12.5" fill="#159947" font-weight="700">✓</text>
<text x="340" y="385.0" font-size="12.5" fill="#10283f"><tspan font-weight="700" fill="#0d2f57">Sync เป็น local ล้วน</tspan> + avatar proxy</text>
<text x="340" y="402.5" font-size="12.5" fill="#10283f">บังคับ image/* และมีเทสต์ outbound-</text>
<text x="340" y="420.0" font-size="12.5" fill="#10283f">inventory คุมจุดออก network</text>
<rect x="772" y="120" width="428" height="336" rx="10" fill="#ffffff" fill-opacity="0.96"/>
<text x="788" y="148" font-size="16" fill="#0d2f57"><tspan font-weight="700" fill="#0d2f57">✓ รอบสอง — ตรวจเชิงลึก (ปิด 3 probes)</tspan></text>
<text x="788" y="178" font-size="12.5" fill="#159947" font-weight="700">✓</text>
<text x="804" y="178.0" font-size="12.5" fill="#10283f"><tspan font-weight="700" fill="#0d2f57">DNS rebinding / CORS</tspan> — <tspan font-weight="700" fill="#0d2f57">ป้องกันครบ</tspan></text>
<text x="804" y="195.5" font-size="12.5" fill="#10283f">Host allowlist ตอบ 403 ต่อโดเมน</text>
<text x="804" y="213.0" font-size="12.5" fill="#10283f">ภายนอกและ Host แบบ userinfo,</text>
<text x="804" y="230.5" font-size="12.5" fill="#10283f">CORS ไม่มี Allow-Origin ให้อ่านข้าม</text>
<text x="804" y="248.0" font-size="12.5" fill="#10283f">origin, FQDN localhost. ผ่านตามออกแบบ</text>
<text x="788" y="273.5" font-size="12.5" fill="#159947" font-weight="700">✓</text>
<text x="804" y="273.5" font-size="12.5" fill="#10283f"><tspan font-weight="700" fill="#0d2f57">Fuzz parsers</tspan> — <tspan font-weight="700" fill="#0d2f57">ผ่าน</tspan>: ไฟล์ขยะ 30 MB,</text>
<text x="804" y="291.0" font-size="12.5" fill="#10283f">JSON ซ้อน 20,000 ชั้น, __proto__</text>
<text x="804" y="308.5" font-size="12.5" fill="#10283f">4 ตำแหน่ง, UTF-8 เสีย → ไม่ crash,</text>
<text x="804" y="326.0" font-size="12.5" fill="#10283f">ไม่เกิด prototype pollution, ตัวอ่าน</text>
<text x="804" y="343.5" font-size="12.5" fill="#10283f">SQLite คืนสถานะ typed ไม่ throw</text>
<text x="788" y="369.0" font-size="12.5" fill="#159947" font-weight="700">✓</text>
<text x="804" y="369.0" font-size="12.5" fill="#10283f"><tspan font-weight="700" fill="#0d2f57">HTML escaping</tspan> — <tspan font-weight="700" fill="#0d2f57">มีวินัยครบ</tspan>: wrapped</text>
<text x="804" y="386.5" font-size="12.5" fill="#10283f">เป็น ASCII ล้วน, dashboard ใช้ React</text>
<text x="804" y="404.0" font-size="12.5" fill="#10283f">ยกเว้น IpCheckPage ซึ่งมี esc() ครอบ</text>
<text x="804" y="421.5" font-size="12.5" fill="#10283f">ทุกค่าจาก upstream (stored-XSS point</text>
<text x="804" y="439.0" font-size="12.5" fill="#10283f">ที่แท้จริงของระบบ)</text>
<rect x="40" y="472" width="1160" height="150" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
<text x="56" y="498" font-size="14" fill="#ffb020" letter-spacing="1"><tspan font-weight="700" fill="#ffb020">METHODOLOGY — ดัดแปลงจาก ANTHROPIC OSS SCANNER</tspan></text>
<rect x="56" y="510" width="216" height="62" rx="10" fill="#ffffff" fill-opacity="0.08"/>
<text x="66" y="531" font-size="12" fill="#ffffff"><tspan font-weight="700" fill="#ffffff">1 · Threat Model ก่อนสแกน</tspan></text>
