<text x="40" y="38" font-size="13" fill="#cfe3f5" letter-spacing="3">SECURITY SCAN ◆ OSS-SCANNER PATTERN TRIAL</text>
<text x="40" y="78" font-size="29" fill="#ffffff"><tspan font-weight="700" fill="#ffffff">ผลสแกนความปลอดภัย </tspan><tspan font-weight="700" fill="#ffffff">TokenTracker</tspan><tspan font-weight="700" fill="#ffffff"> — ไม่พบช่องโหว่ (ตรวจครบ 2 รอบ)</tspan></text>
<text x="40" y="104" font-size="14.5" fill="#a9c6e2">pitimon/TokenTracker @ 33c87e5 · JavaScript ~74,000 บรรทัด · parsers 22 เครื่องมือ · 18 ตุลาคม 2026 (เวลาไทย)</text>
<rect x="40" y="120" width="252" height="118" rx="10" fill="#2ecc71" fill-opacity="0.13" stroke="#2ecc71" stroke-opacity="0.55"/>
<text x="54" y="150" font-size="19" fill="#7ce6a3"><tspan font-weight="700" fill="#7ce6a3">✓ 0 confirmed</tspan></text>
<text x="54" y="174" font-size="19" fill="#7ce6a3"><tspan font-weight="700" fill="#7ce6a3">findings</tspan></text>
<text x="54" y="198" font-size="11.5" fill="#d9f2e3">รอบแรกอ่านโค้ด + รอบสองตรวจเชิงลึก</text>
<text x="54" y="213" font-size="11.5" fill="#d9f2e3">(รันจริง, fuzz, ไล่ data flow) — จุดเสี่ยง</text>
<text x="54" y="228" font-size="11.5" fill="#d9f2e3">ที่ตั้งคำถามไว้ถูกปิดครบทุกข้อ</text>
<rect x="40" y="248" width="121" height="96" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
<text x="52" y="280" font-size="20" fill="#ffffff"><tspan font-weight="700" fill="#ffffff">9 จุด</tspan></text>
<text x="52" y="304" font-size="10.5" fill="#a9c6e2">การป้องกันที่ยืนยัน</text>
<text x="52" y="319" font-size="10.5" fill="#a9c6e2">แล้วว่าแข็งแรง</text>
<rect x="171" y="248" width="121" height="96" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
<text x="183" y="280" font-size="20" fill="#ffffff"><tspan font-weight="700" fill="#ffffff">3/3</tspan></text>
<text x="183" y="304" font-size="10.5" fill="#a9c6e2">deep probes ปิดครบ</text>
<text x="183" y="319" font-size="10.5" fill="#a9c6e2">ไม่เหลือจุดค้างตัดสิน</text>
<rect x="40" y="354" width="121" height="96" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
<text x="52" y="386" font-size="20" fill="#ffffff"><tspan font-weight="700" fill="#ffffff">7/7</tspan></text>
<text x="52" y="410" font-size="10.5" fill="#a9c6e2">กรณีทดสอบ DNS</text>
<text x="52" y="425" font-size="10.5" fill="#a9c6e2">rebinding ผ่านทั้งหมด</text>
<rect x="171" y="354" width="121" height="96" rx="10" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
<text x="183" y="386" font-size="20" fill="#ffffff"><tspan font-weight="700" fill="#ffffff">169 ms</tspan></text>
