<text x="66" y="565" font-size="10.5" fill="#eaf1f8">(ต้นแบบ: threat_model.md)</text>
<text x="274" y="548" font-size="13" fill="#ffb020"><tspan font-weight="700" fill="#ffb020">→</tspan></text>
<rect x="284" y="510" width="216" height="62" rx="10" fill="#ffffff" fill-opacity="0.08"/>
<text x="294" y="531" font-size="12" fill="#ffffff"><tspan font-weight="700" fill="#ffffff">2 · Build &amp; Map</tspan></text>
<text x="294" y="550" font-size="10.5" fill="#eaf1f8">clone ลงสภาพแวดล้อมแยก</text>
<text x="294" y="565" font-size="10.5" fill="#eaf1f8">สำรวจ attack surface</text>
<text x="502" y="548" font-size="13" fill="#ffb020"><tspan font-weight="700" fill="#ffb020">→</tspan></text>
<rect x="512" y="510" width="216" height="62" rx="10" fill="#ffffff" fill-opacity="0.08"/>
<text x="522" y="531" font-size="12" fill="#ffffff"><tspan font-weight="700" fill="#ffffff">3 · สแกนเชิงลึก</tspan></text>
<text x="522" y="550" font-size="10.5" fill="#eaf1f8">ไล่ sinks/entry points ในสภาพ</text>
<text x="522" y="565" font-size="10.5" fill="#eaf1f8">แวดล้อมปิด ไม่ส่งโค้ดออก</text>
<text x="730" y="548" font-size="13" fill="#ffb020"><tspan font-weight="700" fill="#ffb020">→</tspan></text>
<rect x="740" y="510" width="216" height="62" rx="10" fill="#ffffff" fill-opacity="0.08"/>
<text x="750" y="531" font-size="12" fill="#ffffff"><tspan font-weight="700" fill="#ffffff">4 · ตรวจทานตามหลักฐาน</tspan></text>
<text x="750" y="550" font-size="10.5" fill="#eaf1f8">แยก Verified / Inference / Gap</text>
<text x="750" y="565" font-size="10.5" fill="#eaf1f8">ยืนยันไม่ได้ ไม่รายงานเป็น finding</text>
<text x="958" y="548" font-size="13" fill="#ffb020"><tspan font-weight="700" fill="#ffb020">→</tspan></text>
<rect x="968" y="510" width="216" height="62" rx="10" fill="#ffffff" fill-opacity="0.08"/>
<text x="978" y="531" font-size="12" fill="#ffffff"><tspan font-weight="700" fill="#ffffff">5 · รายงานถึงเจ้าของ</tspan></text>
<text x="978" y="550" font-size="10.5" fill="#eaf1f8">คำอธิบาย เส้นทางโจมตี แนว patch</text>
<text x="978" y="565" font-size="10.5" fill="#eaf1f8">ไม่เผยแพร่</text>
<text x="56" y="598" font-size="11" fill="#a9c6e2">ต่างจากต้นแบบ: Anthropic ใช้หลายเอเจนต์ + งบ token สูง และส่งโดยไม่มีมนุษย์ตรวจ — ชุดนี้เอเจนต์เดียว 2 รอบตรวจ และเจ้าของ repo ตรวจทานผลก่อนเสมอ</text>
<text x="56" y="614" font-size="11" fill="#a9c6e2">ขอบเขต: ยังไม่รวมการไล่อ่าน parser ทุกบรรทัด (rollout.js ~9,300 บรรทัด) ผล "ไม่พบ" คือไม่พบในขอบเขตที่ระบุ</text>
<text x="40" y="650" font-size="10" fill="#8fb0cd">หลักฐาน: รันเซิร์ฟเวอร์จริง 7 กรณี · fuzz parsers จริง · อ่านโค้ด serve.js / local-api.js / sqlite-reader.js / IpCheckPage.jsx</text>
<text x="1200" y="650" font-size="10" fill="#8fb0cd" text-anchor="end">REF TT-SCAN-20261018</text>
