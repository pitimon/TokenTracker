name: npm publish

on:
  push:
    branches: [main]

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  # Quality gate: tests and repo validators must pass before publish.
  # Run on Node 24 because dashboard tests import TS directly and some
  # dependencies require newer Web APIs than Node 20 exposes.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Run local CI gate
        run: npm run ci:local

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Skip if this version is already published
      - name: Check if version exists on npm
        id: version-check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          if npm view @ipv9/tokentracker-cli@"$PACKAGE_VERSION" version 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install root dependencies
        if: steps.version-check.outputs.exists == 'false'
        run: npm ci

      - name: Install dashboard dependencies
        if: steps.version-check.outputs.exists == 'false'
        run: npm ci --prefix dashboard

      - name: Build dashboard
        if: steps.version-check.outputs.exists == 'false'
        run: npm run dashboard:build

      - name: Publish to npm
        if: steps.version-check.outputs.exists == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip notice
        if: steps.version-check.outputs.exists == 'true'
        run: echo "v${{ steps.version-check.outputs.version }} already published, skipping."

      - name: Smoke test published package
        run: node scripts/verify-registry-package.cjs "${{ steps.version-check.outputs.version }}"

      # Optionally notify this fork's Homebrew tap. Keep the repository opt-in
      # so fork workflows never dispatch to upstream mm7894215 by accident.
      - name: Dispatch homebrew tap update
        if: steps.version-check.outputs.exists == 'false'
        env:
          HOMEBREW_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_DISPATCH_TOKEN }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          VERSION: ${{ steps.version-check.outputs.version }}
        run: |
          if [ -z "${HOMEBREW_DISPATCH_TOKEN:-}" ]; then
            echo "HOMEBREW_DISPATCH_TOKEN not set — skipping tap dispatch."
            exit 0
          fi
          if [ -z "${HOMEBREW_TAP_REPOSITORY:-}" ]; then
            echo "HOMEBREW_TAP_REPOSITORY variable not set — skipping tap dispatch."
            exit 0
          fi
          curl -sSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HOMEBREW_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${HOMEBREW_TAP_REPOSITORY}/dispatches" \
            -d "{\"event_type\":\"tokentracker-release\",\"client_payload\":{\"source\":\"npm\",\"version\":\"$VERSION\"}}"
