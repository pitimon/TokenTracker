name: CI

# Run the repo's local quality gate (`npm run ci:local`) on every PR into main
# so failing tests or validator regressions block the merge button.
#
# Why this exists: the same gate previously ran ONLY post-merge, as the `test`
# job of npm-publish.yml (`on: push: branches: [main]`). That let the #18
# dashboard redesign merge with two failing layout tests plus a ui-hardcode
# ratchet failure — nothing ran the gate in front of the PR. This workflow
# moves the gate before the merge. (Post-merge coverage on main stays in
# npm-publish.yml, so this triggers on pull_request only to avoid duplicate
# runs.)
#
# To make this actually BLOCK a merge, add "CI / ci:local" as a required
# status check in the repo's branch-protection rules for main.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-local:
    name: ci:local
    # Runs on Linux. The suite had cross-platform failures that only surfaced
    # on a clean Linux checkout — the dashboard-dist build order (#23) and
    # file-rotation detection defeated by Linux inode reuse (#26). Both are
    # fixed, so the gate runs on the cheaper ubuntu runner and this also keeps
    # npm-publish.yml's ubuntu `test` job green. (Keep the job name `ci:local`
    # — it is the required status check in main's branch protection.)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24: dashboard tests import TS directly and some dependencies
          # need newer Web APIs than Node 20 exposes (see npm-publish.yml).
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Run local CI gate
        run: npm run ci:local
